<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Sunset</title>
  <defs>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4caf50"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff59d"/>
      <stop offset="0.7" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#f57c00"/>
    </radialGradient>
  </defs>

  <path id="Hills" fill="url(#hills)"
        d="M64 760 C 240 620, 400 800, 600 680 S 880 640, 960 720 V 960 H 64 Z"/>

  <svg id="Sun" x="332" y="150" width="360" height="360" viewBox="0 0 360 360">
    <title>Sun</title>
    <g id="Rays" stroke="#ffb74d" stroke-width="16" stroke-linecap="round" fill="none">
      <path d="M180 20 V 60"/>
      <path d="M180 300 V 340"/>
      <path d="M20 180 H 60"/>
      <path d="M300 180 H 340"/>
      <path d="M67 67 L 95 95"/>
      <path d="M265 265 L 293 293"/>
      <path d="M293 67 L 265 95"/>
      <path d="M95 265 L 67 293"/>
    </g>
    <circle id="Disc" cx="180" cy="180" r="104" fill="url(#sun)"/>
  </svg>

  <path id="Cloud" fill="#ffffff" fill-opacity="0.92"
        d="M150 470 a 70 70 0 0 1 110 -60 a 90 90 0 0 1 170 20 a 60 60 0 0 1 60 100 H 170 a 60 60 0 0 1 -20 -60 Z"/>

  <path id="Bird" fill="none" stroke="#263238" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"
        d="M600 420 q 45 -50 90 0 q 45 -50 90 0"/>

  <polygon id="Star" fill="#fff9c4"
           points="828,236 843,282 891,282 852,310 867,356 828,328 789,356 804,310 765,282 813,282"/>
</svg>
