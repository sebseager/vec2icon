<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
    <mask id="hole"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="20" fill="#000"/></mask>
  </defs>
  <rect id="Soft" width="100" height="100" fill="#0f0" filter="url(#blur)"/>
  <circle id="Masked" cx="50" cy="50" r="40" fill="#00f" mask="url(#hole)"/>
</svg>
